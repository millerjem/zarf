kind: ZarfPackageConfig
metadata:
  name: rke2-multi-node
  description: "Airgapped RKE2 deployment with server and agent support"
  version: "1.31.0"

variables:
  - name: ARTIFACT_IMAGES
    description: RKE2 air gapped compressed images directory
    default: /var/lib/rancher/rke2/agent/images
  - name: RKE2_SERVER
    description: RKE2 server IP address
    prompt: true
  - name: RKE2_TOKEN
    description: RKE2 server token
    prompt: true

components:
  - name: rke2-images
    required: false
    description: "Includes RKE2 container images for airgapped environments"
    actions:
      onDeploy:
        before:
          - cmd: mkdir -p ${ZARF_VAR_ARTIFACT_IMAGES}
    # Use the following command to generate the list based on your architecture
    # curl -sL https://api.github.com/repos/rancher/rke2/releases/latest | jq -r '.assets[] | select(.name | contains(".zst") and contains("amd64")) | "      - source: " + .browser_download_url + "\n        target: " + .name'
    files:
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-calico.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-calico.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-canal.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-canal.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-cilium.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-cilium.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-core.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-core.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-flannel.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-flannel.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-harvester.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-harvester.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-multus.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-multus.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-traefik.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-traefik.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images-vsphere.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images-vsphere.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2-images.linux-amd64.tar.zst
        target: rke2-artifacts/rke2-images.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/sha256sum-amd64.txt
        target: rke2-artifacts/sha256sum-amd64.txt

  - name: rke2-server
    required: false
    description: "Installs RKE2 server (control plane)"
    actions:
      onDeploy:
        after:
          - cmd: | 
              cat <<EOF> /usr/lib/systemd/system/nm-cloud-setup.service 
              [Unit]
              Description=Generic RHEL Service
              After=network.target

              [Service]
              Type=simple
              User=root
              Group=root
              ExecStart=/path/to/your/service_executable
              Restart=always

              [Install]
              WantedBy=multi-user.target
              EOF
          - cmd: | 
              cat <<EOF> /usr/lib/systemd/system/nm-cloud-setup.timer
              [Unit]
              Description=Generic RHEL Service
              After=network.target

              [Service]
              Type=simple
              User=root
              Group=root
              ExecStart=/path/to/your/service_executable
              Restart=always

              [Install]
              WantedBy=multi-user.target
              EOF
          - cmd: systemctl daemon-reload
          - cmd: systemctl disable nm-cloud-setup.service
          - cmd: systemctl disable nm-cloud-setup.timer
          - cmd: systemctl enable rke2-server.service
          - cmd: INSTALL_RKE2_ARTIFACT_PATH=$(pwd)/rke2-artifacts sh install.sh
          - cmd: systemctl enable rke2-server.service
          - cmd: mkdir -p /etc/rancher/rke2
          - cmd: |
              cat <<EOF> /etc/rancher/rke2/registries.sample
              mirrors:
                "*"
                  endpoint:
                    - "https://{$ZARF_VAR_RKE2_SERVER}:5000"
              EOF
          - cmd: systemctl start rke2-server
          - cmd: cp /etc/rancher/rke2/rke2.yaml rke2-kubeconfig.yaml
          - cmd: chmod a+r rke2-kubeconfig.yaml
          - cmd: echo Token to join node to cluster\n $(cat /var/lib/rancher/rke2/server/node-token)
      onRemove:
        after:
          - cmd: /usr/local/bin/rke2-uninstall.sh
    files:
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2.linux-amd64.tar.gz
        target: rke2-artifacts/rke2.linux-amd64.tar.gz
      - source: hacks/install.sh
        target: install.sh

  - name: rke2-agent
    required: false
    description: "Installs RKE2 agent (worker node)"
    actions:
      onDeploy:
        after:
          - cmd: INSTALL_RKE2_TYPE=agent INSTALL_RKE2_ARTIFACT_PATH=$(pwd)/rke2-artifacts sh install.sh
          - cmd: systemctl enable rke2-agent.service
          - cmd: mkdir -p /etc/rancher/rke2
          - cmd: |
              cat <<EOF> /etc/rancher/rke2/config.yaml
              server: https://${ZARF_VAR_RKE2_SERVER}:9345
              # Paste the token located on the first RKE2 server /var/lib/rancher/rke2/server/node-token  
              token: ${ZARF_VAR_RKE2_TOKEN}
              EOF
          - cmd: systemctl start rke2-agent
      onRemove:
        after:
          - cmd: /usr/local/bin/rke2-uninstall.sh
    files:
      - source: https://github.com/rancher/rke2/releases/download/v1.31.3%2Brke2r1/rke2.linux-amd64.tar.gz
        target: rke2-artifacts/rke2.linux-amd64.tar.gz
      - source: hacks/install.sh
        target: install.sh

